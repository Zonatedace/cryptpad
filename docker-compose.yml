# CryptPad — open-source diagrams + live collaboration.
# Official image: https://hub.docker.com/r/cryptpad/cryptpad
#
#   cp .env.example .env
#   # set CPAD_LOGIN_SALT
#   mkdir -p data/{blob,block,data,datastore} customize
#   docker compose up -d
#   docker compose logs -f cryptpad   # copy the first-run admin URL
#
# SPDX-FileCopyrightText: 2023 XWiki CryptPad Team <contact@cryptpad.org> and contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
# (upstream compose shape). Local additions are MIT — see LICENSE.

services:
  cryptpad:
    image: cryptpad/cryptpad:version-2026.5.1
    hostname: cryptpad
    restart: unless-stopped
    user: "4001:4001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      CPAD_MAIN_DOMAIN: ${CPAD_MAIN_DOMAIN:-http://localhost:3000}
      CPAD_SANDBOX_DOMAIN: ${CPAD_SANDBOX_DOMAIN:-http://localhost:3001}
      CPAD_CONF: /cryptpad/config/config.js
    volumes:
      - ./data/blob:/cryptpad/blob
      - ./data/block:/cryptpad/block
      - ./customize:/cryptpad/customize
      - ./data/data:/cryptpad/data
      - ./data/datastore:/cryptpad/datastore
    expose:
      - "3000"
      - "3003"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cryptpad:
        condition: service_started
    ports:
      - "3080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  bootstrap:
    image: busybox:1.37
    restart: "no"
    user: "4001:4001"
    environment:
      CPAD_LOGIN_SALT: ${CPAD_LOGIN_SALT:-dev-only-change-me}
    volumes:
      - ./customize:/customize
    command:
      - sh
      - -c
      - printf "AppConfig.loginSalt = '%s';\nAppConfig.minimumPasswordLength = 8;\n" "$CPAD_LOGIN_SALT" > /customize/application_config.js

