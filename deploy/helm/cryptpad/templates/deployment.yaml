apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptpad
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptpad.labels" . | nindent 4 }}
    app.kubernetes.io/component: cryptpad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cryptpad
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cryptpad
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 4001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: appconfig
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              sed "s/__LOGIN_SALT__/${LOGIN_SALT}/g" /tmpl/application_config.js.tmpl > /customize/application_config.js
          env:
            - name: LOGIN_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: loginSalt
          volumeMounts:
            - name: data
              mountPath: /customize
              subPath: customize
            - name: config
              mountPath: /tmpl
              readOnly: true
        {{- if .Values.sso.enabled }}
        - name: sso-plugin
          image: alpine/git:2.47.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              git clone --depth 1 --branch {{ .Values.sso.pluginRef | default "main" }} {{ .Values.sso.pluginRepo | quote }} /plugin
              chown -R 4001:4001 /plugin
          volumeMounts:
            - name: sso-plugin
              mountPath: /plugin
        {{- end }}
      containers:
        - name: cryptpad
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 4001
            runAsGroup: 4001
            allowPrivilegeEscalation: false
          env:
            - name: CPAD_MAIN_DOMAIN
              value: {{ .Values.mainOrigin | quote }}
            - name: CPAD_SANDBOX_DOMAIN
              value: {{ .Values.sandboxOrigin | quote }}
            - name: CPAD_CONF
              value: /cryptpad/config/config.js
            {{- if .Values.sso.enabled }}
            - name: SSO_ISSUER_URL
              value: {{ .Values.sso.issuerUrl | quote }}
            - name: SSO_CLIENT_ID
              value: {{ .Values.sso.clientId | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidcClientSecret
            - name: CRYPTPAD_SSO_CONFIG
              value: /cryptpad/config/sso
            {{- end }}
            {{- if .Values.installOnlyOffice }}
            - name: CPAD_INSTALL_ONLYOFFICE
              value: "yes"
            {{- end }}
          ports:
            - name: http-app
              containerPort: 3000
            - name: websocket
              containerPort: 3003
          volumeMounts:
            - name: config
              mountPath: /cryptpad/config/config.js
              subPath: config.js
            {{- if .Values.sso.enabled }}
            - name: config
              mountPath: /cryptpad/config/sso.js
              subPath: sso.js
            - name: sso-plugin
              mountPath: /cryptpad/lib/plugins/sso
            {{- end }}
            - name: data
              mountPath: /cryptpad/blob
              subPath: blob
            - name: data
              mountPath: /cryptpad/block
              subPath: block
            - name: data
              mountPath: /cryptpad/customize
              subPath: customize
            - name: data
              mountPath: /cryptpad/data
              subPath: data
            - name: data
              mountPath: /cryptpad/datastore
              subPath: datastore
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nginxResources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: cryptpad-config
        - name: nginx-config
          configMap:
            name: cryptpad-config
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: data
          persistentVolumeClaim:
            claimName: cryptpad-data
        {{- if .Values.sso.enabled }}
        - name: sso-plugin
          emptyDir: {}
        {{- end }}
